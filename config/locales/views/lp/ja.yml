ja:
  lp:
    index:
      nav:
        project_name: BeSHOP
        form_link: お問い合わせ
      lead: 費用0円!テストSHOP募集!エントリはこちら!
      introduce_html: BeSHOPはお使いのLINE公式アカウント上に簡単にネットショップが作れるクラウドサービスです。こちらのQRコードからLINEで友達登録すると実際にBeSHOPの動作がご確認頂けます。(サンプルショップのため、決済等は発生しません。)
      feature:
        title: BeSHOPの特徴
        summary: BeShopはただ一つの強い目的達成にフォーカスしています。（そのためあえて機能豊富を目指しておりません）そのかわり導入店様には簡単、シンプル、手間無し運用。お客さまには最短、最速でお買いもの。というストレスフリーな全く新しい販売体験をご提供しています。
        one:
          title: LINEのみで完結
          text: ショッピングサイトを持っていない方でもLINEができればＯＫ。
        two:
          title: チャットボット対応
          text: 一度商品登録してしまえば購入完了までチャットボットが自動対応します。(選択肢型)
        three:
          title: シンプル・簡単
          text: 設定や商品登録がとても簡単で知識が少なくても運用できます。
        four:
          title: 公式アカウントをそのまま
          text: ご利用中の公式アカウント(LINE@)にそのまま活用できます。
      solve:
        title: 解決できること
        summary: このような悩みや不満をお持ち方には最適です。
        list:
          one: ホームページを持っていなけどネット販売してみたい…
          two: ネットショップをやる費用やノウハウがない…
          three: あまり手間や時間をかけたくない…
          four: LINE@をやっているけど売上にあまり繋がっていない…
          five: お友達登録者にもっと直接的でインパクトあるアピールをしたい…
          six: 配信するメッセージやクーポンにあまり反応してもらえない…
          seven: 普段あまり宣伝やＰＲをやっていない…
          eight: とにかく簡単にできるショッピングサイトをつくりたい…
      example:
        title: 利用例
        summary: お店の販売やご計画、アイデア次第でいろいろな活用が可能です。
        list:
          one: イチオシ商品のピンポイントアピールに！
          two: タイムセールやお友達限定セール用に！
          three: 人気商品やランキング商品のアピール用に！
          four: サンプルやお試し商品の販売用に！
          five: 正規販売前のテスト販売用に！
          six: メインのショップサイトとは別のサブショップ運営に！
          seven: クーポンやメッセージ配信に合わせた商品案内に！
      expense:
        title: 導入費用
        summary_html: トライアル運用中のため無料です！費用をかけることなくご利用が可能です。<br>初期費用・月額利用料<span class="h1">￥０ </span>
        notice: ※ご利用中の公式アカウントプラン、配信数によっては別途料金が発生する場合があります。
      flow:
        title: 導入の流れ
        summary_html: アカウント登録から出品まで(約10)分で設定が可能です。<br>(事前に公式アカウントID、LINE Pay加盟店IDのご準備が必要です)
        flow:
          one: アカウント登録
          two: LINE連携
          three: 商品登録
          four: 出品
      qa:
        title: よくある質問 ～導入のご検討前に～
        q1_html: Q：なぜ費用がかからないのですか？
        a1_html: A：<u>試験導入店様と一緒に実際の販促活動を通して品質の向上やサービス検証を行わせていただくためです。</u>
        q2_html: Q：システムやLINEに詳しくないのですが導入できますか？
        a2_html: A：<u>大丈夫です。試験運用店舗様は弊社にて無料で登録や運用サポートをさせていただきます。<br>ご要望により弊社でメッセージ配信や商品ＰＲを代行することも可能です。</u>
        q3_html: Q：現在も公式アカウントで商品案内はしていますが何が違いますか？
        a3_html: A：公式アカウントでは商品画像を投稿したりメッセージ配信はできても、直接トーク内でショッピング等を行う事は出来ず、そのためには自前でシステムを開発しなければなりません。<u>BeSHOPはクラウドサービスなので新たにシステムを開発する必要は無く、トーク内ショッピングを導入する事が可能です。</u>
      form:
        thanks_msg: お問い合わせ頂き、ありがとうございました。3営業日以内にご連絡致しますのでお手数ですがしばらくお待ち下さい。
        title: お問い合わせ
        summary_html: BeSHOPの導入を検討したい、または話しだけでも聞いてみたいと言う方は<br>下記メールフォームに必要な事項を明記の上お問い合わせ下さい。<br>2～3営業日位内に弊社担当からご連絡させて頂きます。
        willing:
          a: 導入してみたい
          b: 話しを聞いてみたい
          c: 資料を請求したい
        is_company:
          a: 法人
          b: 個人
      about_company:
        intro: |-
          ByteRoadは2014年4月に設立されたITコンテンツの企画・開発を行う会社です。
          私達はインターネットを通じ、誰もがより簡単に、スマートに経済に参加出来る社会の実現を目指します。
